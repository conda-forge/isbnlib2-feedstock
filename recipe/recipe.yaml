schema_version: 1

context:
  version: "3.11.24"

package:
  name: isbnlib2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/isbnlib2/isbnlib2-${{ version }}.tar.gz
  sha256: d13dbb147779c975f42bd69c10715111a353d66cb720a858009101b8638f6ee7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - isbnlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Extract, clean, transform, hyphenate and metadata for ISBNs (International Standard Book Number).
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/hans-fritz-pommes/isbnlib

extra:
  recipe-maintainers:
    - hans-fritz-pommes
    - tovrstra
